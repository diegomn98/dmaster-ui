# Signed npm publish for @dmaster/ui — via npm TRUSTED PUBLISHING (OIDC).
#
# This file lives in the LIBRARY SOURCE and is mirrored to the public library
# repo (github.com/diegomn98/dmaster-ui) by the workspace release's `subtree
# push`. GitHub only reads workflows from a repo's ROOT `.github/`, so in the
# ngx-dmaster-ui monorepo (where this sits under projects/…) it is INERT; it is
# ACTIVE only in dmaster-ui, where the mirror places it at .github/workflows/.
#
# Why the publish runs here and not in the monorepo: npm provenance (and
# trusted publishing) validate that the published package's `repository.url`
# matches the repository whose OIDC identity ran `npm publish`. Running it in
# dmaster-ui is what lets @dmaster/ui declare `repository.url = dmaster-ui`
# while keeping a signed, transparent Sigstore attestation. To avoid
# duplicating the (workspace-coupled) build, it checks out the monorepo at the
# release tag and runs the very same `npm run build` the monorepo uses — the
# artifact published is byte-for-byte what the monorepo produces.
#
# Authentication: npm trusted publishing — no long-lived npm token. The
# package's trusted publisher on npmjs.com must be EXACTLY: GitHub Actions,
# user `diegomn98`, repository `dmaster-ui`, workflow `publish.yml`, no
# environment (case-sensitive; npm only checks it at publish time). npm swaps
# this job's OIDC token (`id-token: write`) for a one-time publish credential;
# requires npm >= 11.5.1 (checked below). A NEW trusted-publisher config must
# complete a publish within 2 days or it expires — create it on release day.
#
# Fallback (temporary, until the first OIDC publish succeeds and NPM_TOKEN is
# revoked): run this workflow manually with `auth: token` to publish with the
# NPM_TOKEN secret instead. The default path never sees the token, so a broken
# trusted-publisher setup fails loudly instead of silently using the token.
#
# Triggered by a repository_dispatch from the monorepo's release.yml, which
# passes the tag as client_payload.ref.
name: Publish to npm

on:
  repository_dispatch:
    types: [publish]
  # Manual fallback: on the very first release the repository_dispatch can race
  # the arrival of this file on dmaster-ui's default branch, and any publish can
  # be safely re-run. Trigger from the Actions tab with the release tag:
  #   gh workflow run publish.yml -R diegomn98/dmaster-ui -f ref=vX.Y.Z [-f auth=token]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to build and publish (e.g. v0.12.1)'
        required: true
      auth:
        description: 'oidc = trusted publishing (default) · token = NPM_TOKEN fallback'
        type: choice
        options: [oidc, token]
        default: oidc

permissions:
  contents: read
  id-token: write # trusted publishing + npm provenance (Sigstore) need OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The release tag, from whichever trigger fired.
      REF: ${{ github.event.client_payload.ref || inputs.ref }}
    steps:
      # Build from the monorepo source at the exact release tag.
      - name: Check out the workspace at the release tag
        uses: actions/checkout@v5
        with:
          repository: diegomn98/dmaster-ui-workspace
          ref: ${{ github.event.client_payload.ref || inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14). Fail here,
      # with a clear message, rather than with an opaque ENEEDAUTH at publish.
      - name: Check npm supports trusted publishing
        run: |
          echo "node $(node --version) · npm $(npm --version)"
          node -e "
            const [a, b, c] = process.argv[1].split('.').map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error('::error::npm ' + process.argv[1] + ' is older than 11.5.1 — trusted publishing (OIDC) needs npm >= 11.5.1');
              process.exit(1);
            }" "$(npm --version)"

      # Defense in depth: the dispatched tag must match the library version.
      - name: Verify the dispatched tag matches the library version
        run: |
          TAG_VERSION="${REF#v}"
          PKG_VERSION="$(node -p "require('./projects/ngx-dmaster-ui/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Dispatched ref $REF does not match @dmaster/ui version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npx publint dist/dmaster-ui

      # Default path (repository_dispatch, or manual with auth=oidc): no token.
      - name: Publish to npm — trusted publishing (OIDC, signed provenance)
        if: ${{ inputs.auth != 'token' }}
        run: cd dist/dmaster-ui && npm publish --provenance --access public

      # Temporary fallback, manual runs only: remove together with the NPM_TOKEN
      # secret once a release has gone out through trusted publishing.
      - name: Publish to npm — NPM_TOKEN fallback (manual auth=token)
        if: ${{ inputs.auth == 'token' }}
        run: cd dist/dmaster-ui && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
