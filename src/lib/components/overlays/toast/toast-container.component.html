<div class="dm-toasts">
  @for (toast of service.toasts(); track toast.id) {
    <div class="dm-toast" [attr.data-variant]="toast.variant" role="status">
      <span class="dm-toast__icon" aria-hidden="true">
        @switch (toast.variant) {
          @case ('success') {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          }
          @case ('warning') {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3 2 20h20L12 3Zm0 7v4m0 3.5v.5" />
            </svg>
          }
          @case ('danger') {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 8v4m0 4v.01" />
            </svg>
          }
          @default {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5m0-8v.01" />
            </svg>
          }
        }
      </span>

      <span class="dm-toast__message">{{ toast.message }}</span>

      @if (toast.dismissible) {
        <button
          type="button"
          class="dm-toast__dismiss"
          [attr.aria-label]="defaults.dismissLabel"
          (click)="service.dismiss(toast.id)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      }
    </div>
  }
</div>
