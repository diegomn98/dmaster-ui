@if (label()) {
  <label class="dm-search-field__label" [id]="labelId" [attr.for]="inputId">
    {{ label() }}
    @if (required()) {
      <span class="dm-search-field__required" aria-hidden="true">*</span>
    }
  </label>
}

<div
  class="dm-search-field__control"
  [attr.data-color]="color()"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-radius]="radius()"
  [attr.data-invalid]="error() ? '' : null"
  [attr.data-disabled]="isDisabled() ? '' : null"
>
  <svg
    class="dm-search-field__icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="11" cy="11" r="8" />
    <path d="m21 21-4.3-4.3" />
  </svg>

  <input
    #inputEl
    class="dm-search-field__input"
    type="search"
    [id]="inputId"
    [attr.name]="name() || null"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [readOnly]="readOnly()"
    [attr.aria-label]="!label() && ariaLabel() ? ariaLabel() : null"
    [attr.aria-labelledby]="label() ? labelId : null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />

  @if (showClearButton()) {
    <button
      type="button"
      class="dm-search-field__clear"
      [attr.aria-label]="clearAriaLabel()"
      tabindex="-1"
      (click)="onClearClick()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  }
</div>

@if (error()) {
  <p class="dm-search-field__error" [id]="errorId" role="alert">{{ error() }}</p>
} @else if (description()) {
  <p class="dm-search-field__hint" [id]="hintId">{{ description() }}</p>
}
