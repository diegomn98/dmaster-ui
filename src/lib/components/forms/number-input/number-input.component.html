@if (label()) {
  <label class="dm-number-input__label" [id]="labelId" [attr.for]="inputId">
    {{ label() }}
    @if (required()) {
      <span class="dm-number-input__required" aria-hidden="true">*</span>
    }
  </label>
}

<div
  class="dm-number-input__control"
  [attr.data-color]="color()"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-radius]="radius()"
  [attr.data-controls]="hideControls() ? null : ''"
  [attr.data-invalid]="error() ? '' : null"
  [attr.data-disabled]="isDisabled() ? '' : null"
  [attr.data-readonly]="readonly() ? '' : null"
>
  <input
    #inputEl
    class="dm-number-input__input"
    type="text"
    inputmode="decimal"
    role="spinbutton"
    [id]="inputId"
    [attr.name]="name() || null"
    [value]="displayText()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [attr.aria-label]="!label() && ariaLabel() ? ariaLabel() : null"
    [attr.aria-labelledby]="label() ? labelId : null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuetext]="formatted()"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (beforeinput)="onBeforeInput($event)"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />

  @if (!hideControls()) {
    <div class="dm-number-input__controls">
      <button
        type="button"
        class="dm-number-input__step"
        data-direction="down"
        tabindex="-1"
        [attr.aria-label]="decrementLabel()"
        [disabled]="!canDecrement()"
        (click)="onStepClick(-1)"
        (pointerdown)="onStepPointerDown($event, -1)"
        (pointerup)="onStepPointerUp()"
        (pointerleave)="onStepPointerCancel()"
        (pointercancel)="onStepPointerCancel()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
        </svg>
      </button>
      <button
        type="button"
        class="dm-number-input__step"
        data-direction="up"
        tabindex="-1"
        [attr.aria-label]="incrementLabel()"
        [disabled]="!canIncrement()"
        (click)="onStepClick(1)"
        (pointerdown)="onStepPointerDown($event, 1)"
        (pointerup)="onStepPointerUp()"
        (pointerleave)="onStepPointerCancel()"
        (pointercancel)="onStepPointerCancel()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
  }
</div>

@if (error()) {
  <p class="dm-number-input__error" [id]="errorId" role="alert">{{ error() }}</p>
} @else if (description()) {
  <p class="dm-number-input__hint" [id]="hintId">{{ description() }}</p>
}
