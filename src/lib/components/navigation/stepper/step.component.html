<button
  #header
  type="button"
  class="dm-step__header"
  [id]="headerId"
  [disabled]="disabled()"
  [attr.aria-current]="isActive() ? 'step' : null"
  [attr.aria-disabled]="locked() ? 'true' : null"
  [attr.aria-controls]="panelId"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <span class="dm-step__indicator" aria-hidden="true">
    @if (indicatorTemplate(); as tpl) {
      <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="indicatorContext()" />
    } @else if (error()) {
      <svg viewBox="0 0 24 24" fill="none" class="dm-step__glyph">
        <path d="M12 7.5v5.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" />
        <circle cx="12" cy="16.75" r="1.15" fill="currentColor" />
      </svg>
    } @else if (completed() && !isActive()) {
      <svg viewBox="0 0 24 24" fill="none" class="dm-step__glyph">
        <path
          d="M20 6.5 9.5 17 4 11.5"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    } @else {
      <span class="dm-step__number">{{ index() + 1 }}</span>
    }
  </span>

  <span class="dm-step__text">
    <span class="dm-step__label">{{ label() }}</span>
    @if (optional()) {
      <span class="dm-step__optional">{{ optionalLabel() }}</span>
    }
  </span>

  <span class="dm-step__connector" aria-hidden="true"></span>
</button>

<div
  class="dm-step__panel"
  [id]="panelId"
  role="region"
  [attr.aria-labelledby]="headerId"
  [hidden]="!isActive()"
>
  <ng-content />
</div>
