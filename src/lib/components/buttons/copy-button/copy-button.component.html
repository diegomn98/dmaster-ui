<dm-button
  [color]="color()"
  [variant]="variant()"
  [radius]="radius()"
  [size]="size()"
  [disabled]="disabled()"
  [ariaLabel]="ariaLabel()"
  [dmCopyToClipboard]="value()"
  [resetDelay]="resetDelay()"
  #cp="dmCopyToClipboard"
  (copied)="copied.emit($event)"
  (copyError)="copyError.emit($event)"
>
  <span class="dm-copy-button__icon" aria-hidden="true">
    @if (cp.isCopied()) {
      @if (hasCopiedIcon()) {
        <ng-content select="[dmCopiedIcon]" />
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
      }
    } @else {
      @if (hasCopyIcon()) {
        <ng-content select="[dmCopyIcon]" />
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      }
    }
  </span>

  @if (copyLabel() || copiedLabel()) {
    <span class="dm-copy-button__text">{{
      cp.isCopied() ? copiedLabel() || copyLabel() : copyLabel()
    }}</span>
  }

  <span class="dm-copy-button__live" role="status" aria-live="polite">{{
    cp.isCopied() ? copiedAriaLabel() : ''
  }}</span>
</dm-button>
