<!--
  Projected content is captured ONCE here and stamped into whichever body
  renders. Two literal <ng-content> slots inside @if/@else would leave the
  interactive branch empty: Angular assigns projected nodes to a single slot.
-->
<ng-template #content>
  <span class="dm-chip__leading"><ng-content select="[dm-chip-leading]" /></span>
  <span class="dm-chip__label"><ng-content /></span>
</ng-template>

@if (interactive()) {
  <button
    #bodyEl
    type="button"
    class="dm-chip__body"
    [disabled]="isDisabled()"
    [attr.aria-pressed]="selectable() ? effectiveSelected() : null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.tabindex]="tabIndex()"
    (click)="onBodyClick($event)"
    (keydown)="onKeydown($event)"
  >
    @if (selectable() && effectiveSelected()) {
      <svg
        class="dm-chip__check"
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 6 9 17l-5-5" />
      </svg>
    }
    <ng-container [ngTemplateOutlet]="content" />
  </button>
} @else {
  <span class="dm-chip__body">
    <ng-container [ngTemplateOutlet]="content" />
  </span>
}

@if (removable()) {
  <button
    #removeEl
    type="button"
    class="dm-chip__remove"
    [disabled]="isDisabled()"
    [attr.tabindex]="interactive() ? -1 : tabIndex()"
    [attr.aria-label]="removeLabel()"
    (click)="onRemoveClick($event)"
    (keydown)="onRemoveKeydown($event)"
  >
    <svg
      class="dm-chip__remove-icon"
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
}
